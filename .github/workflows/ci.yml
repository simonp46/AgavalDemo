name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      MSSQL_SA_PASSWORD: CI_OnlyPassword123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Backend
        run: dotnet restore backend/GestorInventario.sln

      - name: Build Backend
        run: dotnet build backend/GestorInventario.sln --configuration Release --no-restore

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build container images
        run: docker compose build

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Backend
        run: dotnet restore backend/GestorInventario.sln

      - name: Test Backend
        run: dotnet test backend/GestorInventario.sln --configuration Release --no-restore

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test Frontend
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

# Release and deployment are intentionally excluded from this CI workflow.
